services:
  # Dev MongoDB
  mongodb:
    image: mongo:6
    container_name: lms-tlu-mongodb-dev
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - lms-tlu-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev backend: Node + nodemon auto-reload
  backend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      MONGO_URL: mongodb://mongodb:27017/school
      PORT: 5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lms-tlu-network

  # Dev frontend: CRA dev server with hot reload
  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_URL: http://backend:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lms-tlu-network

  # Dev ai-service: FastAPI + uvicorn hot reload
  ai-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./ai_service:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      MONGO_URI: mongodb://mongodb:27017/mydb
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lms-tlu-network

volumes:
  mongodb_data_dev:


networks:
  lms-tlu-network:
    driver: bridge
